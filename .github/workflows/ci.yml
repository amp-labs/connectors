name: CI
run-name: ${{ github.actor }} is running build / lint / test
on:
  push:
    branches:
      - main
  pull_request: {}
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
        # git ls-remote https://github.com/actions/checkout.git refs/tags/v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # git ls-remote https://github.com/actions/setup-go.git refs/tags/v7
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.1"
          # Caching is handled explicitly below (with restore-keys), so that
          # go.mod/go.sum-only bump PRs still restore a warm cache.
          cache: false

      # Go module/build caches and the golangci-lint analysis cache.
      #
      # Main pushes start cold and save what they built; PRs restore the newest
      # main cache and never save. So the cache only ever holds what one main
      # build needs (~3.6 GB, ~60k files). When main restored the previous
      # cache before saving, old module versions and build outputs piled up:
      # 32 GB and 665k files, which took 2 to 4 minutes to unpack on every run.
      #
      # GitHub never overwrites a cache key, so the key ends in the commit SHA.
      # A key of only the go.sum hash made every main push after the first
      # spend ~3 minutes packing the cache and then fail to save it.
      - name: Restore Go caches
        if: github.ref != 'refs/heads/main'
        # git ls-remote https://github.com/actions/cache.git refs/tags/v4
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: v2-ci-go1.27.1-${{ hashFiles('go.sum') }}-${{ github.sha }}
          # Newest cache for this go.sum, else the newest of any.
          restore-keys: |
            v2-ci-go1.27.1-${{ hashFiles('go.sum') }}-
            v2-ci-go1.27.1-

      # TEMPORARY: measures what the restored cache holds. Remove before merge.
      - name: Show cache sizes
        run: |
          for d in ~/go/pkg/mod ~/go/pkg/mod/cache/download ~/.cache/go-build ~/.cache/golangci-lint; do
            echo "$(du -sh "$d" | cut -f1) $(find "$d" -type f | wc -l) files  $d"
          done

      # The custom golangci-lint binary (with the nogoroutine/modulelinter
      # plugins) only changes when its config or plugin source changes, so
      # cache it instead of rebuilding it from source every run.
      - name: Cache custom-gcl binary
        # git ls-remote https://github.com/actions/cache.git refs/tags/v4
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: custom-gcl
          key: v1-custom-gcl-${{ hashFiles('.custom-gcl.yml', 'tools/linters/**') }}

      # Pre-install the lint tools that make's check-linters would otherwise
      # install the slow way (notably `cargo install typos-cli`, which compiles
      # typos from source on every run).
      - name: Install lint tools
        run: |
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile and
          # the version in .custom-gcl.yml.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

          go install github.com/daixiang0/gci@latest

          TYPOS_VERSION="v1.48.0"
          mkdir -p /tmp/typos-install
          curl -sSfL "https://github.com/crate-ci/typos/releases/download/${TYPOS_VERSION}/typos-${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /tmp/typos-install
          install /tmp/typos-install/typos "$(go env GOPATH)/bin/typos"

          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate
        run: go generate ./...

      # Compile every package without linking. `go build ./...` links all ~900
      # main packages (test/, scripts/, examples/), and Go never caches a link,
      # so that step took 4 to 7 minutes even with a warm cache.
      # `go list -export` runs the compiler on every package, main packages
      # included, and fails on the same compile errors. `make test` still
      # links a test binary for every package that has tests.
      - name: Build
        run: go list -export ./... > /dev/null

      - name: Lint
        run: make lint

      - name: Test
        # -count=1 on main pushes forces fresh test execution (no cached test
        # results), so merges are always validated cold while PRs stay fast.
        env:
          GOFLAGS: ${{ github.ref == 'refs/heads/main' && '-count=1' || '' }}
        run: make test

      # TEMPORARY: measures what gets saved. Remove before merge.
      - name: Show cache sizes before save
        if: always()
        run: |
          for d in ~/go/pkg/mod ~/go/pkg/mod/cache/download ~/.cache/go-build ~/.cache/golangci-lint; do
            echo "$(du -sh "$d" | cut -f1) $(find "$d" -type f | wc -l) files  $d"
          done

      - name: Save Go caches
        # TEMPORARY: also saves on this PR, to measure a cold run and then a
        # warm one. Remove the head_ref clause before merge.
        if: always() && (github.ref == 'refs/heads/main' || github.head_ref == 'ci/faster-ci')
        # git ls-remote https://github.com/actions/cache.git refs/tags/v4
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          # Same key as "Restore Go caches", which doesn't run on main.
          key: v2-ci-go1.27.1-${{ hashFiles('go.sum') }}-${{ github.sha }}
